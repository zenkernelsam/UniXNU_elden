[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = ["soc/sm8750/dts/**", "dts/**"]
inputs = ["SM8750 MPIDRs 0x0, 0x100, 0x200, 0x300, 0x400, 0x500, 0x10000 and 0x10100.", "GICv3 distributor 0x16000000, redistributor base 0x16080000 and stride 0x40000.", "19.2 MHz architectural timer and PSCI SMC conduit."]
configuration = ["The SoC DTSI declares eight CPU nodes, timebase-frequency = 19200000 and psci method = smc.", "The GIC node exports unixnu,adt-name = intc.", "The device defconfig enables ARM DT platform, ArmCpu, native timer and PAN."]
procedure = ["Compile dts/elden.dts with the SoC include path.", "Generate an ADT from the DTB and inspect /cpus, /psci and /arm-io/intc.", "Boot the smallest XNU payload and record the first CPU, GIC or timer failure."]
findings = ["The board evidence documents the same eight MPIDR layout used by other SM8750 ports.", "The shared ADT generator emitted cpu0 as running and all other cores as waiting; ArmCpu does not probe secondary nubs unless sheng-smp is enabled.", "ArmCpu reads the GIC through /arm-io/intc and requires a complete two-range reg property.", "The old kernel argument set enabled armcpu-spi-ipi before elden had evidence that SGIs fail or that per-core SPI routing works. Phase 2.1 removed it from the single-boot-CPU milestone.", "Secondary CPU startup and both SGI and SPI IPI delivery are not device-verified for elden.", "v49 shows the boot CPU survives arm_init, the vm/pmap bootstrap, bsd_init, IOKit and kext loading until AMFI panics, so the earlier claim that it halts inside a stage-16 startup entry is withdrawn; ArmCpu, GIC and timer checkpoints are still not separately recorded because no kernel trace names them yet.", "Phase 2.5 explains why no probe ever printed kernel text: pexpert/arm/pe_kprintf.c gates the whole kprintf body on disable_serial_output and disable_kprintf_output (both default true), and vcputc_options gates painting on gc_initialized and gc_enabled (gc_enable runs only from initialize_screen with kPEAcquireScreen). PE_init_iokit calls PE_init_printf(TRUE) -> vcattach just before the stage-16 call, so forcing PE_create_console into kPETextMode and mapping the GOP framebuffer brings the console up without rebuilding XNU.", "v50 device evidence shows AMFI passes its security-mode-change gate but then panics \"AMFI: No PMGR?\" at ConfigurationSettings.cpp:235, because the developer-mode latch needs an ApplePMGRNub service that elden does not publish. That latch is AMFI policy rather than a hardware description gap, so phase 2.5 skips it with a probe poke and leaves a real power-management driver to phase 3."]
completion = ["The boot CPU reaches the ArmCpu checkpoint.", "GIC distributor and its own redistributor frame map successfully.", "Timer handling works before secondary cores or IPI transport are qualified."]
limits = ["No elden XNU CPU, GIC or timer log exists yet.", "The eight-core topology is described, but SMP bring-up is not claimed."]
next_action = ["Phase 2.5 kernel-side is proven: v51 boots to the root-device wait, so ArmDTPlatform, the boot CPU and the platform experts work. Add explicit ArmCpu, GIC and timer checkpoint output next (armcpu-diagnostics=1 and the debug=0x14e bits) before claiming the CPU area completion. Defer SPI IPI, SGI delivery, secondary startup and SMP qualification to separate device checks."]
evidence = [
  { kind = "source", reference = "soc/sm8750/dts/sm8750.dtsi", result = "SM8750 CPU, PSCI, GICv3 and timer resources." },
  { kind = "source", reference = "docs/PHASE2-HANDOFF.md", result = "Board CPU/GIC/timebase inventory and planned diagnostic sequence." },
  { kind = "host", reference = "docs/PHASE2.1-STATUS.md", command = ".venv/bin/python scripts/phase2_1_audit.py --linux-dir .cache/elden-linux", revision = "16e592abee8a550dec8154ed1f38b5ebc4f16213", result = "2026-10-25: independently decoded ADT contains the eight expected MPIDRs, cpu0 running and seven CPUs waiting, 19.2 MHz timebase, SMC PSCI, and GIC distributor/redistributor bases with 0x40000 stride. No device CPU checkpoint is claimed." },
  { kind = "host", reference = "docs/PHASE2.2-STATUS.md", command = "xcrun nm -g .cache/phase2-plan/UniXNU/out/elden/ipados-17.7.11-21H461/elden/kernel/kernel.macho", revision = "c91a2191fdf591a401a03027ed8b7fbfdbcad3a7", result = "2026-10-25: the prelinked kernel exports ArmCpu probe/start, GIC distributor and timer-related symbols and ArmDTPlatform configure/createDeviceNubs symbols. Symbol presence is source evidence, not a device checkpoint." },
]

