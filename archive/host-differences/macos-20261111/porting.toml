[[area]]
id = "display"
status = "implemented"
components = ["GopFramebuffer", "AppleKeyStoreState"]
paths = ["soc/sm8750/dts/**", "dts/**", "scripts/build-elden-gop.py", "scripts/audit-elden-gop.py", "scripts/driver-patches/EldenDisplayGlue.cpp", "scripts/driver-patches/EldenKeyEventsGlue.cpp", "scripts/driver-patches/EldenUserWaitProbe.c", "patches/xnu/elden-usb-graphics-console.patch", "patches/xnu/elden-console-physical-marker.patch", "patches/xnu/elden-display-mode-observer.patch"]
inputs = ["1904x3040 bonded dual-DSI panel with DSC.", "UEFI GOP framebuffer and splash reservation.", "SM8750 DPU/DSI/PHY and backlight sequencing."]
configuration = ["The phase 1 menu renders through UEFI GOP.", "XNU display and IOMobileFramebuffer components remain disabled."]
procedure = ["Keep display handoff on GOP for the first kernel milestone.", "Record a visible checkpoint after DarwinBoot.", "Add DPU/DSI only after kernel entry is stable."]
findings = ["2026-11-07 device: normal RAM launch policy disabling unported locationd/nehelper breaks the observed startup waits. Actual GOP readback now shows SpringBoard lock screen with wallpaper/date/clock (frame14 CRC df4e0f93). Next frame has grey banding; this is a GUI milestone, not full display/GPU/backlight qualification. Documentation: docs/SPRINGBOARD-GUI-20261107.md.", "State queries are now accepted but startup still waits in leaf service chains: profiled -> NEHelper and contextstored -> CoreLocation/motion. Original locationd and nehelper-embedded job identities audited. Adding explicit RAM-only normal launchd overrides for these two unported services; no executable patch or fabricated service reply.", "Notification-only service removes liveactivitiesd BRK; SpringBoard advances to applicationDidFinishLaunching, then waits on managed configuration, while liveactivitiesd waits on CoreDuet. Preparing explicit elden-key-state=1 using the catalog state/bookkeeping ABI for verified unprotected RAM only; default remains closed and no key operations are supplied. Extending wait capture to profiled/contextstored.", "Original-cache disassembly proves liveactivitiesd BRK follows null MKBEventsRegister result in IOSKeybag.internal; Chrono waits in ActivityOutputClient initialization. Adding catalog AppleKeyStoreState notification-only service, with state clients always refused; require explicit ephemeral-storage=1 and mounted writable 512MiB RAM Data, no persistence and armed recovery.", "2026-11-07 read-only user stacks: three consecutive SpringBoard main-thread snapshots stop at CHSChronoServicesConnection _subscribeToExtensions during SBHIconManager initialization. No proof yet that a keystore or GPU shim fixes this. Extend capture to chronod/liveactivitiesd/pkd/coreduetd. One earlier UFS timeout recovered via verified 180s fastboot; same-image replay passed storage and produced all four captures.", "scale2 device: two full-screen frames were copied and retired after the boot logo, then OS blanked the display. User is away, so GUI visual confirmation pending. Adding opt-in bounded 238x380 RGB565 readback of the first two presented full frames, atomic USB rows/CRC32, no disk writes.", "2026-11-07 device: original class size/identity/ancestry, IOSurfaceRoot, 1904x3040 GOP mapping, NativeLegacyDisplay start/registration and user clients all passed. Corrected persistent console physical marker via a local PE_Video copy. SpringBoard now fails FBSDisplayMode validation: real fields width1904 height3040 refresh60 preferredScale0 override0; exact original helper rejects zero effective scale. Testing explicit chosen/display-scale=2 with the same kernel. No GUI or frame claim.", "2026-11-07: real shared-cache symbolication identifies SpringBoard main CADisplay absence. Catalog GopFramebuffer NativeLegacyDisplay adapter now checks original class identity, 0x18a0 extent and ancestry at runtime, waits for SDAM recovery, and uses only the verified 1904x3040 GOP memory. ABI/build/hardware qualification pending.", "GOP display is device-verified in the UniXNU menu.", "No XNU display provider has been validated.", "The panel path remains a known high-risk cold-boot area.", "DarwinBoot fills boot_args Video[0..5] from GOP and the device prints base 0xFC800000, row 7616, 1904x3040, depth 32. After the MMU is on the kernel only maps VirtualBase + (PA - PhysicalBase) inside the 256 MiB window, so the frame buffer is outside that window and later console writes need an explicit mapping or must happen before the switch."]
