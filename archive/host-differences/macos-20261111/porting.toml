ration remain pending; no all-driver image claimed.", "2026-11-07: manual120-second poweroff and8-second autostart candidates include unchanged FD/56MiB FAT,6GiB ADT, original TrustCache, RAM Data and session IDs. Independent RSA/data/stock properties and embedded-file audits pass; every boot index stays1738713600@0.", "2026-11-06 prerequisites: direct9ebc7b6a and KShimC6af63b3e experiments are signed at exact stock index. A frozen dual11 control rebuild is byte-identical; the48MiB recovery FAT preserves the full stock kernel/initrd and raises the explicit FreeExec copy bound to64MiB. Source runtime and old signed artifacts are preserved.", "2026-11-06 host: source GOP console kernel/archives/prelink completed; separate read-only UFS root-check archive compiled with inherited identity DMA and LUN selection. TWRP/Linux EFI prototype and userdata/ESP design remain hardware-unverified. Details and bounded evidence in docs/NIGHT-BRINGUP-20261106.md; no stock index change or device write.", "2026-11-05 offline: ramdisk argv placement fixed; gzip made deterministic; embedded validation checks both header and actual x3 constant and rejects a FAT BPB extending past published bytes. The isolated marker candidate uses the accepted FD and a rebuilt 56 MiB shim, and passes kernel/ADT/FAT/FD checks. See docs/OFFLINE-PAYLOAD-20261105.md. No device run is claimed.", "The documented Phase 1 build was device-verified and the current procedure rebuilds and passes structural checks.", "The same current recipe produced 94b6a6315b04fc9d276bc15e9519107be292244380fc3bf139f5af6c96a3bb0a instead of the historical accepted image hash; byte-for-byte rebuild identity is not claimed, but the new image completed two owner RAM cold boots.", "The verified UniXNU third-party pin is intentionally retained for the accepted build.", "Phase 2.2 produced a 21,206,040-byte native kernel and a 54,050,816-byte prelinked kernel. The 57-patch sequence selects 30 executable Apple components, 7 kernel interfaces and 30 module entrypoints.", "A 58,720,256-byte FAT volume held the 54,063,968-byte kernel/config/ADT set with 3,734,016 bytes free and a byte-identical kernel readback; that 2026-10-25 volume was actually FAT32 (mformat -F) and is only mountable because 56 MiB clears the EnhancedFatDxe FAT16 cluster floor.", "EnhancedFatDxe derives the FAT type from the cluster count: a FAT32 BPB with fewer than 65,525 clusters returns EFI_VOLUME_CORRUPTED, so the 8 MiB FAT32 probe volume never became a SimpleFileSystem and UniXNU fell back to the built-in menu. The probe and payload volumes are now written as FAT16 by scripts/make_payload.py, and scripts/verify_phase2_artifact.py recomputes the cluster count and BPB label for every candidate.", "The prelink report remains runtime_qualified=false, abi_qualified=false and loadable=false until device execution evidence exists.", "The embed_payload images were device-verified on 2026-11-01: EnhancedFatDxe mounted both FAT16 volumes, UniXNU read \\EFI\\UniXNU\\unixnu.toml from the embedded payload and listed its entries next to the green checkpoint, so the kernel-field payload channel replaces the ramdisk channel for phase 2.3.", "The menu used the automatic scale (MAX (1, Width / 270) = 7 on the 1904-pixel short side) and truncated the footer; the scale is now pinned to 4 in package/phase2.3-unixnu.toml, which scripts/make_phase2_payload.py reads by default.", "2026-11-01: the stage 2.3 embed-payload boot image 3dc8ae9611ec899ff14d50032ecd0ce2dd1035b3af9f9d3183bbab6cd41bcd93 reached the DarwinBoot hand-off in two RAM cold boots: the screen printed the ARM64, video and inputs-validated lines and the Entry.S green band, so EL1, the 256 MiB window at 0xB927C000 and ExitBootServices are device-verified. The green band is the loader breadcrumb; it does not prove that the XNU entry instruction ran.", "The stage 2.5 entry probe appends an r-x LC_SEGMENT_64 after Kernel.End, rewrites the entry B to branch into it and draws a blue band from