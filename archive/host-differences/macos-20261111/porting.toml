findings = ["2026-11-08 final offline: bounded Data owner/GPT pair/layout/WRITE+SYNC+readback/fence and strict seed guard are in the actual115a3a9a prelink, derivative d78fe346. Both e3fc8a52/off and54e487b4/inspect are96MiB stock-index read-only candidates with persist0, no write/init/backup authorization. Original root remains read-only; actual persistent I/O, KeyStore/encryption and crash recovery unqualified. See docs/PERSISTENT-FOUNDATION-20261108.md.", "2026-11-08 M2 offline: fixed tail plan from the complete post-partition GPT and SHNGROOT header; root, metadata, two2GiB stage slots,112GiB Data pool and256MiB log are disjoint. Initial512MiB store stays at the same first LBA. New pair-GPT/WRITE+SYNC/readback/freeze core passes40+56 sanitizer assertions. Actual kernel integration is in preparation; no persistent write or device operation occurred. Secure KeyStore/persistent encryption remains a required independent gate.", "2026-11-08 host: canonical native_ufs_part_find/read now restricted to CRC-checked unique LUN4 modem_a inside the existing hostRead4k owner/mutex/deadline/quarantine. Actual GPT4870+89600 parsed;490 ASan/UBSan checks. New primary UFS object compiled and original190-slot bindings requalified. No storage write or device test.", "2026-11-07: two UFS timeouts under userland load (13/17 poll observations across 1.13/2.37 seconds); passive later DMA snapshots completed. Added one fresh ordered completion sample at deadline before quarantine, preserving fatal/invalid OCS rejection and all protocol checks. Host adversarial test reproduces the original descheduling race and rejects pending/invalid/fatal completions; hardware validation pending.", "2026-11-07 device SPMI probe: version70020000/count896, SID0 peripheral71 has APIDs525(owner3),586(owner0),675(owner1); unique HLOS write channel is586. Old KShimC reboot adapter only acceptedv8 despite actualv7 resources. Added resource-pinned SDAM reason backend and pure selector/bit-preservation tests; no ownership changes or disk writes. Physical SDAM reset qualification pending; BCB route rejected and rolled back.", "2026-11-07 recovery preparation: opt-in boot-time misc command RMW after full LUN0 GPT pair/identity checks, single FUA block plus cache sync/readback; panic path performs no UFS access and waits180s on the physical counter before PSCI SMC. Host corruption/overlap/command-preservation tests pass. Physical recovery route test pending; ordinary root IOMedia remains readonly. Current 5a35288a autoboot passed600s without kernel panic, SpringBoard still crashes.", "2026-11-07 follow-up: exact 21H461 watchdogd and launchd hashes and launch job verified. Added explicit watchdog-only normal launchd override on fresh RAM Data and read-only EL0 abort/BRK tracing; critical-exit and original executable protections remain. Signed 5a35288a candidate defaults to XNU with 8-second timeout, device validation ongoing. Panic-to-fastboot after180s is a separate unqualified capability.", "2026-11-07 device: RamBlock candidate 430db415 mounts RAM Data disk1s1 writable, SystemOS authorized and both status=0. Original /sbin/launchd exec and PID1 EL0 BSD syscall confirmed over CDC; 26 good status responses. Later watchdogd SIGTRAP causes kernel panic and SpringBoard also crashes: bounded userspace achieved, stable OS/UI not achieved. See docs/USERLAND-USB-20261107.md.", "2026-11-07 host follow-up: build-elden-ram-block.py compiles catalog-pinned RamBlock 25c57e0e9b68bf452dd1986914525edc9d2320bc using the existing storage ABI; shared binding auditor now supports NativeRamBlock (190 slots, 24 overrides, 11 imports) and reuses UFS aliases without authentication stubs. Candidate uses actual 512MiB seed UUID E5D06647-CCB4-491D-A897-3C21B55703CF; persistent store not enabled. Previous live Data failure was target=0/spec=0/cache=0 with mount ENOENT on bare md0. RamBlock device test pending.", "2026-11-07 device: USB CDC 1209:7004 ELDEN-XNU delivers 18882 bytes of real XNU/UFS/root/panic logs to Windows COM13; eight status replies configured=1 dtr=1 dropped=0. Data mount still ENOENT stage2, PID1 not executed. Follow-up elden-data-mount-detail.patch carries lookup errors in the fatal report because post-BSD IOLog was suppressed.", "2026-11-07 device: standard chosen/root-matching by OS volume UUID replaces boot-uuid-media resource wait; exact prior kernel/authblob/6GiB retained. Photo confirms BSD root disk3s1 and APFS mount-complete; next panic is scratch Data mount ENOENT. Added elden-data-mount-diagnostics.patch and USB boot-argument observation for bounded follow-up; no Data or USB stream pass claimed. See docs/ROOTMATCH-DATA-20261107.md.", "2026-11-07: LUN0/ipados root header read is device-verified. New AVB-kernel-pinned complete-image and per-block verification, live readonly media ancestry bridge, SystemOS union and RAM Data startup candidate compile/link and host checks pass; new mount/startup remains untested on hardware.", "2026-11-06 prerequisites: official21H461 OS/SystemOS and original trust inputs are verified. Native readonly APFS inspection supplies actual filesystem UUIDs. A9381609472-byte raw root layout passes file readback and the actual RootLayout parser with file callbacks; Data, runtime policies and real root-target kernel remain pending. No hardware disk access.", "2026-11-06: standalone GPL UEFI UFS backend and current/previous stage2 applications compile; original/session suites and independent SHA/header/torn-update tests pass. Actual AAVMF probe platform rejection and RAM FAT child failure/cleanup/retry pass; no tablet UFS operation is claimed. See docs/UFS-STAGE2-20261106.md.", "The full root-check kernel 07d4df1d… compiled/prelinked successfully; the diagnostic derivative is 3fd40e9f….", "190 original/concrete slots, 23 concrete overrides, 11 original imports and actual C2/D2 were qualified without replacing the storage class with stubs.", "The final derivative executes to the real registered original storage class in QEMU using the actual menu arguments; class sizes are 0xd8/0x90/0x88.", "The compressed EFI loader decoded all complete assets in AAVMF, and a neutral-debug DarwinBoot test build passed EBS to the same XNU console and UFS registration gate. This is not a test of the entire vendor firmware.", "The exact accepted DarwinBoot binary needs its platform graphics debug sink in AAVMF; its observed fault is before EBS, unlike a proved hardware handoff failure.", "2026-11-06 hardware: corrected arm-io/AAPL,phandle ADT and fixed-address SMMU loads reach read-only LUN4 GPT/block checks. LUN0/ipados source configuration is added; block publication and root mounting remain pending."]
