findings = ["2026-11-10 v40 device:150s target-only RAM shutdown/sync/SDAM returned fastboot; second boot still returned after COM reader closed at75s; third boot original ACK RPC returned at~77s before deadline. Three distinct per-boot nonces. Physical disconnect/reconnect remains unverified. Stock Android/full SHA/root restored. docs/RECOVERY-DEADLINE-20261110.md and workbench HANDOVER-AUTORETURN-20261110.md.", "2026-11-10 v39 native audit refused SIMD stack initialization in RecoveryShutdown error path; no image was signed/flashed. v40 adds general-regs-only to the recovery-bearing UFS compilation and dependent USB C objects; original storage ABI/module checks will rerun.", "2026-11-10 v39 preparation: optional90..900s target-side RAM-only return deadline shares shutdown/sync/SDAM with RPC;atomic ownership prevents late ACK cancellation or double shutdown. Host reconnect retains attempted actions,requires same physical device and per-boot nonce,marks raw gaps;14 host tests and1000 sanitizer races pass. Native compilation/device qualification pending; no GPIO/charging experiment yet.", "2026-11-10 v38 adds one-shot session-bound swipe-up RPC and same-pending exclusion with Settings;stop/error always releases contact. Request whitelist and bound control-frame interleaving CRC tests pass. Live software swipe succeeds without Home; stock Android restored/full SHA after each final test sequence.", "2026-11-08 persistent fence preparation: RAM RPC behavior retains RB_QUICK sync. Future writable Data uses full shutdown and last-VFS-unmount fence; unknown/in-flight writes hold automatic reset. Neither writable Data nor that recovery branch is hardware-qualified; only read-only layout candidates delivered.", "2026-11-08 host: two-port UCSI query/cmd ACK, version-specific orientation/sink-known flags and raw USB/WLS/55 telemetry added under elden-ucsi-query=1. Foreign owner and channel epochs cannot complete the other protocol; timeout requires fresh link. Original48B interface/control clues were checked against stock instructions; hardware logs remain pending.", "2026-11-08 host: independent FW-check, ADSP survey and explicit DSP/PMIC modes with signed session IDs. Firmware check reads and hashes original modem assets without PAS; actual raw37-field client keeps coherent cycles/connection epochs and refuses stale/timeout reuse. Both UART/USB return configurations preserved; new diagnostic output not yet hardware-verified.", "2026-11-07: panic duplication is fixed and device-confirmed. New generic MIT DWC3 core plus guarded elden adapter, nonblocking console ring, bounded panic drain, session-bound status and PID1 EL0 syscall observation are built; CDC hardware remains unqualified.", "2026-11-06 prerequisites: final EFI31744-byte application passes FDT mailbox, parent metadata and memory-report contracts, and reaches the same XNU registration return1 through the neutral-debug AAVMF driver. Known-read expectations are prepared but were not sampled on the tablet.", "2026-11-06 host: source GOP console kernel/archives/prelink completed; separate read-only UFS root-check archive compiled with inherited identity DMA and LUN selection. TWRP/Linux EFI prototype and userdata/ESP design remain hardware-unverified. Details and bounded evidence in docs/NIGHT-BRINGUP-20261106.md; no stock index change or device write.", "2026-11-05 offline: marker menu fallback is 600 seconds; NativeUfs probe 2 deliberately panics to display read-only GCC/UFS diagnostics. Probes 7/8 inspect SMMU/CB; SM8750 rejects probe 3. This changes acceptance wording, not the driver. See docs/OFFLINE-PAYLOAD-20261105.md.", "The original accepted image is b56ef4b7e5a71382b8c279c4ee1560764fabd126ba37ac0fd6e495c80b9ec6e1.", "Earlier UFSDxe failure images are identified and must not be reused.", "Phase 2 requires separate kernel and DarwinBoot evidence.", "On 2026-10-25 a fresh phase 1 rebuild produced image SHA-256 94b6a6315b04fc9d276bc15e9519107be292244380fc3bf139f5af6c96a3bb0a and FD SHA-256 e5420517d55f4b638c07617a252d3a65c95cfb731584dcb10dd1d98bae412580. The build and prior local candidate were read-only preserved under .cache/phase2.0, and the owner then completed two RAM cold boots of the new image.", "Phase 2.1 host auditing now checks the ADT independently and records FDT, ADT, UEFI memory and boot argument sources under .cache/phase2.1 without replacing phase 1 artifacts.", "Phase 2.2 audits passed for 1,010 target objects, 7,730 prelink XML tags, iOS 17.0 deployment, 4 KiB TCR and the expected ArmDTPlatform/ArmCpu symbols. These are host-only checks.", "2026-11-01: the two phase 2.3 embed-payload images both reached the UniXNU menu with the green payload checkpoint and printed config: \\EFI\\UniXNU\\unixnu.toml, so a visible menu no longer depends on the ABL ramdisk.", "2026-11-01: choosing xnu on the stage 2.3 boot image printed the DarwinBoot ARM64/video/inputs-validated lines twice and painted the Entry.S green band. This is loader evidence; the entry probe now supplies the first kernel-side checkpoint."]
completion = ["Every claimed checkpoint has a reproducible command, image hash and visible result.", "Failures reach a diagnosable screen or log instead of a silent hang."]
limits = ["The DarwinBoot hand-off and ADT acceptance are device-verified, but there is no XNU console or serial log yet; the entry probe is the first kernel-side checkpoint and still needs a device result.", "The generated hardware ADT input is a minimal host candidate. The separate firmware memory description contains the source-derived reservation map, but neither is a live device FDT.", "The historical accepted image bytes are absent from the workspace, so they cannot be booted or byte-compared locally."]
next_action = ["Run the PC CDC logger before boot. Require actual bytes, matching session, both mount results and repeated PID1 user-trap status; do not infer success from a launchd filename."]
