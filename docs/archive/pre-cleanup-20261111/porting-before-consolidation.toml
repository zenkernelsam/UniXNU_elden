[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = ["soc/sm8750/dts/**", "dts/**"]
inputs = ["SM8750 MPIDRs 0x0, 0x100, 0x200, 0x300, 0x400, 0x500, 0x10000 and 0x10100.", "GICv3 distributor 0x16000000, redistributor base 0x16080000 and stride 0x40000.", "19.2 MHz architectural timer and PSCI SMC conduit."]
configuration = ["The SoC DTSI declares eight CPU nodes, timebase-frequency = 19200000 and psci method = smc.", "The GIC node exports unixnu,adt-name = intc.", "The device defconfig enables ARM DT platform, ArmCpu, native timer and PAN."]
procedure = ["Compile dts/elden.dts with the SoC include path.", "Generate an ADT from the DTB and inspect /cpus, /psci and /arm-io/intc.", "Boot the smallest XNU payload and record the first CPU, GIC or timer failure."]
findings = ["2026-11-10 v38 SCMI device survey: Base2/PERF4,NCC0+NCC1 each16 levels; NCC0 one LEVEL_GET index8=1996800kHz. NCC1 GET status-2; LIMITS_GET both-3.41 transfers/free1/access-error0,then stop by design. No level/limits SET, no secondary startup. Full active frequencies/trend/SMP remain unverified.", "2026-11-10 v36/v37 actual registered1/scheduler-available1. Source review: reset masks MPIDR to Aff0, compiled table4; ml_get_cpu_number and ArmCpu identity mask lose Aff2. No SMP/voltage/frequency changes. Source/config/array sizing and independent recovery require review before delayed secondary startup.", "2026-11-09 CPU PERF survey native kernel21281087 and signed boot aece7477/sessionc74d6219c6d7c4b0 completed offline.2177 sanitizer checks,83 frozen sources, original30 modules/HID bindings/stock AVB pass. No PERF/LIMITS SET and no forced mailbox-free operation. Tablet kept in stock Android during optional cable-layout question; candidate unflashed. AW99706/I2C888000 and alternative stock11/76 nodes identified; brightness implementation and actual chip response remain pending. docs/CPU-POWER-SURVEY-20261109.md.", "2026-11-09 power investigation: actual Android uses SCMI CPU policies0/6; stock DT confirms CPUCP TX17830000 doorbell104 and SCMI SRAM17b4e000/200, matching the hardware-proven Pagani SCMI client. New CPU PERF survey reuses pinned c888efd3 header with pre-I/O read-message admission; no LEVEL_SET/LIMITS_SET, no forced mailbox release.2177 sanitizer checks cover probe/current/limits, rejected setters and timed-out ownership. Native build pending. Armada AW99706 backlight is I2C10@888000/address76/GPIO88; Android currently backlight0/off. The legacy qcom-cpufreq-hw path is not used by this stock Android.", "The board evidence documents the same eight MPIDR layout used by other SM8750 ports.", "The shared ADT generator emitted cpu0 as running and all other cores as waiting; ArmCpu does not probe secondary nubs unless sheng-smp is enabled.", "ArmCpu reads the GIC through /arm-io/intc and requires a complete two-range reg property.", "The old kernel argument set enabled armcpu-spi-ipi before elden had evidence that SGIs fail or that per-core SPI routing works. Phase 2.1 removed it from the single-boot-CPU milestone.", "Secondary CPU startup and both SGI and SPI IPI delivery are not device-verified for elden.", "v49 shows the boot CPU survives arm_init, the vm/pmap bootstrap, bsd_init, IOKit and kext loading until AMFI panics, so the earlier claim that it halts inside a stage-16 startup entry is withdrawn; ArmCpu, GIC and timer checkpoints are still not separately recorded because no kernel trace names them yet.", "Phase 2.5 explains why no probe ever printed kernel text: pexpert/arm/pe_kprintf.c gates the whole kprintf body on disable_serial_output and disable_kprintf_output (both default true), and vcputc_options gates painting on gc_initialized and gc_enabled (gc_enable runs only from initialize_screen with kPEAcquireScreen). PE_init_iokit calls PE_init_printf(TRUE) -> vcattach just before the stage-16 call, so forcing PE_create_console into kPETextMode and mapping the GOP framebuffer brings the console up without rebuilding XNU.", "v50 device evidence shows AMFI passes its security-mode-change gate but then panics \"AMFI: No PMGR?\" at ConfigurationSettings.cpp:235, because the developer-mode latch needs an ApplePMGRNub service that elden does not publish. That latch is AMFI policy rather than a hardware description gap, so phase 2.5 skips it with a probe poke and leaves a real power-management driver to phase 3."]
completion = ["The boot CPU reaches the ArmCpu checkpoint.", "GIC distributor and its own redistributor frame map successfully.", "Timer handling works before secondary cores or IPI transport are qualified."]
limits = ["No elden XNU CPU, GIC or timer log exists yet.", "The eight-core topology is described, but SMP bring-up is not claimed."]
next_action = ["Phase 2.5 kernel-side is proven: v51 boots to the root-device wait, so ArmDTPlatform, the boot CPU and the platform experts work. Add explicit ArmCpu, GIC and timer checkpoint output next (armcpu-diagnostics=1 and the debug=0x14e bits) before claiming the CPU area completion. Defer SPI IPI, SGI delivery, secondary startup and SMP qualification to separate device checks."]
