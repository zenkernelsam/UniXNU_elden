istorical elden UFS M=0/nonzero control bits. v28 corrects M-bit semantics and freezes full observed SCTLR;20499 route sanitizer checks pass. v26 SIMD build retained unflashed; v27 six actual linked touch objects passed noFP/SIMD audit.", "2026-11-09 DMA integration in progress: exact v25 global baseline gates one new SIDa3 slot7 sharing unchanged bank0 only after fresh SCTLR0/width/global/idle checks. Failed writes retain lease/resources, no context/global configuration writes. Route17418 and transfer21211 sanitizer checks, platform303552 checks pass. Canonical first-transfer word0->8 fixed. Mode5 native buffers/route/platform/ID integration and full build preparing; no new device write. Android remains stock8b8e72da for charging.", "2026-11-09 v25 live: exact88083769/sessionb2da49234e530d4e, complete132 SMR/S2CR and83 global CBAR/CBA2R records; only slots0..6 active, no a3/b6 route.89146B/drop0, healthy Root/Data, RPC and actual PC fastboot confirmed. No CB accesses or SMMU/DMA writes. Restored stock8b8e72da with full SHA, Android green/root and57pct/3985mV/-408mA charge. New single-SID route+SE-DMA integration required before T1 ID. docs/TOUCH-SMMU-LIVE-20261109.md.", "2026-11-09 v24 live:59pct/4026mV Android; writer3998mV/yes. Full d285afd9 device SHA, healthy Root/Data,81478 bytes/drop0, bound RPC and PC fastboot confirmed. SMMU132 groups and83 banks; no SIDa3 or SIDb6 matches. GENI idle, FIFO disabled, GSI=f and DMA=1. T1 still incomplete. v25 preparing global-only complete slot/bank inventory; no context-bank reads/SMMU writes or DMA. User explicitly reconnected Android, live authorization current.", "2026-11-09 offline native DMA buffer: 2x16KiB cached contiguous descriptor plus private16KiB staging; actual CTR_EL0 cache geometry and cvac/civac/ivac+dsb; bus addresses remain supplied by a qualified SIDa3 epoch owner. create cleanup retains its handle on failure; exported buffers cannot be freed without external stopped/unmapped proof.408018 ASan/UBSan cache-range assertions; standalone arm64/iOS17 archiveec6eee93/96376B. Original21H461 four base-vtable methods and release checked against compiled offsets. Not runtime-linked or hardware-qualified. Next live candidate remains v24 survey. docs/TOUCH-DMA-NATIVE-20261109.md.", "2026-11-09 offline T1 DMA: separate DmaTransfer wrapper around pinned canonical QcomGeniSpi, with SIDa3 epoch/lease checks, whole-cache-line DMA buffers, frozen engine configuration, private RX staging and quarantine after uncertain completion. 21060 ASan/UBSan assertions passed; standalone arm64/iOS17 archive4aa67e2e/9240B compiled without automatic initializers. No native mapping provider, runtime integration, kernel relink or device test. v24 survey remains the next live candidate; user charging-ready notice required. docs/TOUCH-DMA-CORE-20261109.md.", "2026-11-09 final T1 survey v24: signed d285afd9/session219d57d3edfcf40c, kernelc794b1cc/52691048B,127 compiled source/build inputs.302933 platform assertions and >128/duplicate/masked/invalid SMMU survey cases pass ASan/UBSan. Original30 modules,HID,assets,stock AVB verified. Mode4 has clock-only entry acquisition and global SIDa3/b6 inventory; no SPI/SE-DMA commands,pin/rate modifications or SMMU writes. Candidate unflashed. Tablet restored stock Android before user disconnected PC for PD charging; explicit user ready notice required before hardware resumes. docs/TOUCH-DMA-SURVEY-20261109.md.", "2026-11-09 T1 live0ee8f8ba: correct SPI protocol1/32bit/depth16 but FIFO-disabled1. Refused before chip transfer, released0 and PC-fastboot; stock Android restored. New explicit touch-mode4 surveys engine and SMMU global SMR/S2CR/CBAR only after clock qualification; no SPI/DMA commands, pin/rate/SE setup or SMMU writes.302933 platform assertions and >128/overlap/invalid SMMU cases pass sanitizers. Armada TB322FC SE SIDa3 and GPI SIDb6 differ; new enij90 TB321FU/SM8650/NT36523 is a supplementary reference, not replacement wiring. User is charging with PC cable removed; all subsequent work offline until explicit test-ready reply.", "2026-11-09 owner prioritization: active execution plan T1 live controller ID->T2 firmware/points->T3 actual HID->T4 finger swipe SpringBoard, with power/recovery continuously guarded. New packaging profiles preserve qualified M3/UCSI/500mA/charge controls while selecting touch modes1/2/3. Backlight, double-tap wake and UFS concurrency review queued; no simultaneous peripheral changes. Work repository research/EXECUTION-PLAN-20261109.md.", "2026-11-09 owner requirement: implement configurable double-tap-to-wake from screen-off in iPadOS. Owner confirms stock feature in daily use and was operating tablet during the observed wake events; those logs do not establish an abnormal-wake bug. Joint input/sleep work: qualify actual NT36536 low-power gesture commands/event IDs/IRQ, wake display to lock screen without bypassing authentication, test repeated cycles and standby consumption. Pinned bf96c3d4 minimal Novatek SPI driver has no gesture/suspend path found, so do not assume upstream supplies this feature. Documented acceptance in docs/DOUBLE-TAP-WAKE-20261109.md; implementation/hardware pending.", "2026-11-09 no-Home identity candidate: iPad8,1/J317 with pad artwork2388, thin-bezel1 and home-button-type2/no menu, preserving Lenovo compatible and all physical resources. Uses hardware-qualified v11 kernel dfc6b8db; signed cfef1394/session82eaa003c6589bf9 at1738713600/footer0. Independent original modules/ABI/assets/ADT checks passed; unflashed, navigation bar/swipe and physical Face ID are not claimed. Work repository research/IPAD-PRO-GESTURES-20261109.md.", "2026-11-09 gesture request: accepted ADT had no buttons node. Add exact sheng home-button-type2/no menu plus thin-bezel1 while preserving iPad7,1/J120/Lenovo compatible and all hardware/memory fields. Exact512MiB RAM Data seed mounted read-only on Mac, no MobileGestalt cache; same packed SHA483125a2. Signed ADT-only candidateaaac30ab, no hardware UI/gesture qualification yet; no physical Face ID claim.", "2026-11-08 final offline: full NT36536 protocol/SE4 PIO/SRAM/native split HID compiled, linked and prelinked as kernel2d8cd9e7. Five96MiB stock-index candidates signed and independently admitted;207 HID slots/52 native imports/220+37 private tables and original30 module identities checked with the retained AMFI diagnostic word. Physical bus/touch remains hardware-unqualified; exact compiled source freeze and test order in docs/NT36536-RUNTIME-20261108.md.", "2026-11-08 M1 offline: complete stock NT36536 SRAM protocol passed 1890 sanitizer checks; new idle/FIFO-gated SE4 PIO owner with bounded clock/pin restore and timeout quarantine is prepared. Full Mac build and physical operation still pending.", "Original 21H461 metaclass recovery found EventDriver220/Event37 slots; physical adaptation bounds the upstream256 copy to220 and validates live private-table identity, retaining all original Apple instructions.", "2026-11-08 offline: QcomGeniSpi, ShengNovatekTouch protocol and NT36536 point decoder compiled for iOS17. Exact source/object SHA and no automatic initializers verified. Physical SPI/firmware/IRQ/HID remains disabled.", "2026-11-07 hardware: original IOHIDEventDriver matched the owned virtual source; one session-bound Home press/release both returned zero and actual post-input framebuffer frames show SpringBoard Home, Settings, App Store and Dock. 420 seconds, 136 statuses, dropped0, no kernel panic. Physical touch remains unqualified; see docs/HID-HOME-LIVE-20261107.md.", "The exact Armada-referenced DTS blob matches the materialized local source. NT36536 native 108-byte point decoding is implemented separately from sheng THP: 16-bit big-endian coordinates, checksum, inclusive maxima, duplicate/range/length rejection and no destination mutation on failure. Host ASan/UBSan vector test passed; SPI/firmware/physical HID are not yet integrated.", "2026-11-07 M1: canonical ShengHidInput 5f3a37ce co