cation d80dd93a passed18 real cycles and correct initial holds/PC return.", "2026-11-09 live backlight inspectfe3a3475 refused stage3/-16,zero chip transfers/writes,restored resources and confirmed PC-fastboot. Existing log omitted which entry-state check failed; added a read-only status/GSI/DMA/TX/RX/secondary/FW/clock snapshot with admission unchanged. Native rebuild for diagnosis pending. Actual PD comparison now proves18 identical PDO/RDO cycles versus stock; +471mA tail battery drain persists. CPU read-only candidateaece7477 now running.", "2026-11-09 final offline backlight bundle v15/power14/backlight5: kernel7a6eafc9/52658280B,101 frozen sources, native archive6d8d30a8/268760B. Genuine original AppleARMBacklight169 slots/0x370 and three native ancestry bindings, all final vtable entries, deferred initializer and original30 modules passed.14726 ASan/UBSan register/fault/clock checks and 16.16 fade tests. inspect fe3a3475, dim/restore7ab4ea8d and servicea343a2d6 are signed at stock1738713600/footer0, unflashed. Shared clock gate mask includes SE7 bit17/IBI27,28. Tablet remains stock Android charging. CoreBrightness/physical brightness/power savings are not hardware-qualified. docs/BACKLIGHT-RUNTIME-20261109.md.", "2026-11-09 AW99706 native preparation: new SE2 GENI ownership backend preserves inherited clock/pins/HWEN, refuses active/GPI/DMA engines and isolates unacknowledged timeout. Shared GCC restoration retains active Bluetooth gates. Host sanitizer transaction/fault checks pass; real AppleARMBacklight ABI/service integration is being built and remains unflashed. See docs/BACKLIGHT-IDENTITY-20261109.md.", "2026-11-09 actual stock wake/sleep I2C trace confirms active AW99706 at adapter4/address76, register11 ID07, full32-byte register dump and 04/05 brightness order. Trace46/46, no overruns; isolated instance removed and screen restored off. New EldenBacklight/Aw99706.c implements inherited-config brightness/off/resume using only04/05/0d(bit7); no HWEN/MTP/boost/current writes.95 ASan/UBSan checks include actual trace, faults, partial writes and readback. Native GENI backend/service integration remains pending; not claimed as working XNU brightness. research/backlight-elden-20261109/oem-trace-proof.json.", "2026-11-07 device: normal RAM launch policy disabling unported locationd/nehelper breaks the observed startup waits. Actual GOP readback now shows SpringBoard lock screen with wallpaper/date/clock (frame14 CRC df4e0f93). Next frame has grey banding; this is a GUI milestone, not full display/GPU/backlight qualification. Documentation: docs/SPRINGBOARD-GUI-20261107.md.", "State queries are now accepted but startup still waits in leaf service chains: profiled -> NEHelper and contextstored -> CoreLocation/motion. Original locationd and nehelper-embedded job identities audited. Adding explicit RAM-only normal launchd overrides for these two unported services; no executable patch or fabricated service reply.", "Notification-only service removes liveactivitiesd BRK; SpringBoard advances to applicationDidFinishLaunching, then waits on managed configuration, while liveactivitiesd waits on CoreDuet. Preparing explicit elden-key-state=1 using the catalog state/bookkeeping ABI for verified unprotected RAM only; default remains closed and no key operations are supplied. Extending wait capture to profiled/contextstored.", "Original-cache disassembly proves liveactivitiesd BRK follows null MKBEventsRegister result in IOSKeybag.internal; Chrono waits in ActivityOutputClient initialization. Adding catalog AppleKeyStoreState notification-only service, with state clients always refused; require explicit ephemeral-storage=1 and mounted writable 512MiB RAM Data, no persistence and armed recovery.", "2026-11-07 read-only user stacks: three consecutive SpringBoard main-thread snapshots stop at CHSChronoServicesConnection _subscribeToExtensions during SBHIconManager initialization. No proof yet that a keystore or GPU shim fixes this. Extend capture to chronod/liveactivitiesd/pkd/coreduetd. One earlier UFS timeout recovered via verified 180s fastboot; same-image replay passed storage and produced all four captures.", "scale2 device: two full-screen frames were copied and retired after the boot logo, then OS blanked the display. User is away, so GUI visual confirmation pending. Adding opt-in bounded 238x380 RGB565 readback of the first two presented full frames, atomic USB rows/CRC32, no disk writes.", "2026-11-07 device: original class size/identity/ancestry, IOSurfaceRoot, 1904x3040 GOP mapping, NativeLegacyDisplay start/registration and user clients all passed. Corrected persistent console physical marker via a local PE_Video copy. SpringBoard now fails FBSDisplayMode validation: real fields width1904 height3040 refresh60 preferredScale0 override0; exact original helper rejects zero effective scale. Testing explicit chosen/display-scale=2 with the same kernel. No GUI or frame claim.", "2026-11-07: real shared-cache symbolication identifies SpringBoard main CADisplay absence. Catalog GopFramebuffer NativeLegacyDisplay adapter now checks original class identity, 0x18a0 extent and ancestry at runtime, waits for SDAM recovery, and uses only the verified 1904x3040 GOP memory. ABI/build/hardware qualification pending.", "GOP display is device-verified in the UniXNU menu.", "No XNU display provider has been validated.", "The panel path remains a known high-risk cold-boot area.", "DarwinBoot fills boot_args Video[0..5] from GOP and the device prints base 0xFC800000, row 7616, 1904x3040, depth 32. After the MMU is on the kernel only maps VirtualBase + (PA - PhysicalBase) inside the 256 MiB window, so the frame buffer is outside that window and later console writes need an explicit mapping or must happen before the switch."]
