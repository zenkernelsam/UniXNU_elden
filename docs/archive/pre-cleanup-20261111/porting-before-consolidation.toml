findings = ["2026-11-08 WCN7861 source25-file freeze with kernel d951a861, imagef5f586f6/off and e658f3f9/inspect;stock1738713600/footer0 and old assets preserved. The exact known Data VFS fence is removed for non-Data profiles so legacy RAM builds link; no writable Data guard is bypassed.", "2026-11-08 persistent foundation: full native kernel compile and separate prelink; final output avoids overwriting the earlier526b artifact. OriginalFD/shim/56MiBFAT/ADT/trust/RAMData/6GiB/recovery parameters retained. Successful75-file source snapshot separated from earlier build attempts. Off/inspect signatures verified at1738713600/footer0 with no persistent write authorization.", "2026-11-08 NT36536 off/digitizer/identify/firmware/touch staged images are96MiB, stock1738713600/footer0, originalFD/shim/56MiBFAT/ADT/trust/RAMData/6GiB/autoboot/recovery preserved. The successfully compiled source freeze is separate from the failed prebuild whole-table-SHA variant; inherited private pointers are checked against actual rebound base tables.", "2026-11-08 host: independent UCSI45 candidate7deffb4c/kernel83c8539c/session867a344b0d62e213 signed at exact1738713600/footer0/parent3. Original execution/FD/shim/FAT/ADT/trust/Data/6GiB/HID/autoboot/return config preserved. No device action. Original M3 exact file+manifest source hashes recovered/frozen/re-audited independently from immutable new45 snapshot.", "2026-11-08 host: three96MiB variants firmware0255a06f, survey8af07e18 and pmicbd6f235a signed at exact1738713600/footer0/parent3. Same final kernel59b26be2, old FD/shim/56MiB FAT/6GiB/ADT/trust/RAM Data/HID/autoboot/return config; independent RSA/data/Props/FAT/mode/HID checks passed. Device remains restored Android for charging; no new flash.", "2026-11-08 offline: nine core archives (16 objects) and51-object A830 independently verified on Windows: archive/source/object SHA, iOS17 and staged accelerator/4 original imports.96MiB boot/56MiB FAT unchanged. Capacity/resource/final integration remain pending; no all-driver image claimed.", "2026-11-07: manual120-second poweroff and8-second autostart candidates include unchanged FD/56MiB FAT,6GiB ADT, original TrustCache, RAM Data and session IDs. Independent RSA/data/stock properties and embedded-file audits pass; every boot index stays1738713600@0.", "2026-11-06 prerequisites: direct9ebc7b6a and KShimC6af63b3e experiments are signed at exact stock index. A frozen dual11 control rebuild is byte-identical; the48MiB recovery FAT preserves the full stock kernel/initrd and raises the explicit FreeExec copy bound to64MiB. Source runtime and old signed artifacts are preserved.", "2026-11-06 host: source GOP console kernel/archives/prelink completed; separate read-only UFS root-check archive compiled with inherited identity DMA and LUN selection. TWRP/Linux EFI prototype and userdata/ESP design remain hardware-unverified. Details and bounded evidence in docs/NIGHT-BRINGUP-20261106.md; no stock index change or device write.", "2026-11-05 offline: ramdisk argv placement fixed; gzip made deterministic; embedded validation checks both header and actual x3 constant and rejects a FAT BPB extending past published bytes. The isolated marker candidate uses the accepted FD and a rebuilt 56 MiB shim, and passes kernel/ADT/FAT/FD checks. See docs/OFFLINE-PAYLOAD-20261105.md. No device run is claimed.", "The documented Phase 1 build was device-verified and the current procedure rebuilds and passes structural checks.", "The same current recipe produced 94b6a6315b04fc9d276bc15e9519107be292244380fc3bf139f5af6c96a3bb0a instead of the historical accepted image hash; byte-for-byte rebuild identity is not claimed, but the new image completed two owner RAM cold boots.", "The verified UniXNU third-party pin is intentionally retained for the accepted build.", "Phase 2.2 produced a 21,206,040-byte native kernel and a 54,050,816-byte prelinked kernel. The 57-patch sequence selects 30 executable Apple components, 7 kernel interfaces and 30 module entrypoints.", "A 58,720,256-byte FAT volume held the 54,063,968-byte kernel/config/ADT set with 3,734,016 bytes free and a byte-identical kernel readback; that 2026-10-25 volume was actually FAT32 (mformat -F) and is only mountable because 56 MiB clears the EnhancedFatDxe FAT16 cluster floor.", "EnhancedFatDxe derives the FAT type from the cluster count: a FAT32 BPB with fewer than 65,525 clusters returns EFI_VOLUME_CORRUPTED, so the 8 MiB FAT32 probe volume never became a SimpleFileSystem and UniXNU fell back to the built-in menu. The probe and payload volumes are now written as FAT16 by scripts/make_payload.py, and scripts/verify_phase2_artifact.py recomputes the cluster count and BPB label for every candidate.", "The prelink report remains runtime_qualified=false, abi_qualified=false and loadable=false until device execution evidence exists.", "The embed_payload images were device-verified on 2026-11-01: EnhancedFatDxe mounted both FAT16 volumes, UniXNU read \\EFI\\UniXNU\\unixnu.toml from the embedded payload and listed its entries next to the green checkpoint, so the kernel-field payload channel replaces the ramdisk channel for phase 2.3.", "The menu used the automatic scale (MAX (1, Width / 270) = 7 on the 1904-pixel short side) and truncated the footer; the scale is now pinned to 4 in package/phase2.3-unixnu.toml, which scripts/make_phase2_payload.py reads by default.", "2026-11-01: the stage 2.3 embed-payload boot image 3dc8ae9611ec899ff14d50032ecd0ce2dd1035b3af9f9d3183bbab6cd41bcd93 reached the DarwinBoot hand-off in two RAM cold boots: the screen printed the ARM64, video and inputs-validated lines and the Entry.S green band, so EL1, the 256 MiB window at 0xB927C000 and ExitBootServices are device-verified. The green band is the loader breadcrumb; it does not prove that the XNU entry instruction ran.", "The stage 2.5 entry probe appends an r-x LC_SEGMENT_64 after Kernel.End, rewrites the entry B to branch into it and draws a blue band from boot_args->Video before branching back to the original target; scripts/darwinboot_preflight.py replays ParseKernel/AdtNode on the host (16 segments, span 0x4310000, window 0x10000000) and the 12,738,560-byte image a4ad1fc74abef35da9f947c350ff5763f2b8dea61da5adeee72aefcd0a67abf7 passes the stage 2.3 verifier with probe kernel a8f04b455996a4656a3055254c127e42f0676187c9550aa0b5fa57bbbe94e2d9."]
completion = ["All format 2 build steps run from the resolved output directory.", "The payload contains the kernel, ADT and declared optional inputs.", "The boot image matches the ABL header and size limits."]
limits = ["The three 2026-10-31 device failures (two v3 probe boots, one v4 boot) share the broken FAT32 probe volume, so they do not disprove the ABL ramdisk handoff; that channel is unproven rather than closed, and reopening it needs firmware that still contains UniXNURamDiskDxe. The embed_payload channel that replaced it is device-verified; see docs/PHASE2.3-STATUS.md.", "The current 4 MiB board payload belongs to the accepted phase 1 build; the phase 2 payload is 56 MiB and is only used by the separate out/phase2.3 candidate.", "The 2.2 host build used Command Line Tools with an iPhone platform shim because full Xcode is absent; release rebuilding still requires the official Xcode/iPhoneOS SDK.", "The entry-probe kernel is a diagnostic artifact for out/phase2.4 only; it is not the release kernel and must not replace the phase 2.3 payload in a final image."]
next_action = ["Tomorrow collect OEM Android dual-cell/dual-port evidence, require native power admission, then test signed read-only survey through qualified auto-boot/USB/RPC/panic recovery. Larger archives remain offline until linking/capacity/SMMU ownership pass."]
