name = "elden"
soc = "SM8750P"
os_profile = "ipados-17.7.11-21H461"
summary = "Y700 Gen4 original iPadOS17.7.11 reaches SpringBoard Home with USB diagnostics and controlled fastboot recovery. Physical peripherals, persistent Data and power remain in development; Android restored for charging,2026-11-08 night is offline only."
[[area]]
id = "configuration"
status = "host-verified"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "soc/**", "configs/**", ".github/**", ".gitignore", "local.toml.example"]
inputs = ["Use the ARM64 and iPadOS 17.7.11 profiles supplied by UniXNU.", "Select the shared platform, CPU and DarwinBoot components.", "Provide an SM8750 profile until an official shared SoC repository exists."]
configuration = ["board.toml declares schema_version = 2, soc_source = sm8750 and os_profile = ipados-17.7.11-21H461.", "The complete component list is explicit because profile arrays replace inherited arrays.", "Configuration and patch roots are ordered as ARM64, SoC, OS and device.", "soc/sm8750 supplies the transition profile and is referenced from feeds.toml."]
procedure = ["Run defconfig from a current UniXNU checkout.", "Inspect status JSON for profile order, component dependencies, patch order and output path.", "Replace the local SoC source with a reviewed UniXNU-sm8750-common commit before release."]
findings = ["2026-11-09 no-Home identity candidate: iPad8,1/J317 with pad artwork2388, thin-bezel1 and home-button-type2/no menu, preserving Lenovo compatible and all physical resources. Uses hardware-qualified v11 kernel dfc6b8db; signed cfef1394/session82eaa003c6589bf9 at1738713600/footer0. Independent original modules/ABI/assets/ADT checks passed; unflashed, navigation bar/swipe and physical Face ID are not claimed. Work repository research/IPAD-PRO-GESTURES-20261109.md.", "2026-11-08 offline: pinned peripheral snapshots, nine deterministic ARM64/iOS17 core archives and51-object Adreno830 built separately from the qualified kernel. New builder/auditor verifies source/archive/object identity and deployment. No hardware components selected; docs/NIGHT-OFFLINE-20261108.md.", "2026-11-06 host: source GOP console kernel/archives/prelink completed; separate read-only UFS root-check archive compiled with inherited identity DMA and LUN selection. TWRP/Linux EFI prototype and userdata/ESP design remain hardware-unverified. Details and bounded evidence in docs/NIGHT-BRINGUP-20261106.md; no stock index change or device write.", "The repository was format 1 and did not select shared SoC or OS profiles.", "A public UniXNU-sm8750-common repository was not available during migration.", "Keeping a separate local SoC profile preserves parser validation without mislabelling unqualified hardware support as shared.", "Phase 2.0 resolved ARM64, local SM8750, iPadOS and device layers; the selected component order, 56 patches, 4 KiB page setting and separate format 2 output were checked with current UniXNU.", "Phase 2.1 keeps the XNU handoff and firmware memory description separate from the phase 1 dummy firmware DTB.", "Phase 2.2 resolved 57 patches after adding compile-time-disabled PMGR context required by the shared boot-progress patch. CONFIG_XNU_BOOT_PROGRESS is disabled for the minimum kernel because that diagnostic layer currently requires UFS, owner-root and Virtio.", "Phase 2.5 proved XNU entry execution from the device and located the Apple-platform dependencies without adding a panic renderer: PE_create_console reads the iBoot video console handoff at 0x3C0F0000, and the kernel then runs through bsd_init, IOKit and kext loading until AMFI panics with AMFI: not booted with security-mode-change-enabled. The earlier reading that a stage-16 kernel_startup_initialize_upto entry never returns is withdrawn: those freezes were panics with the kprintf gate closed."]
completion = ["board.toml resolves four ordered configuration layers.", "All selected components come from the UniXNU catalog and include their dependencies.", "No array field depends accidentally on inheritance.", "The SoC source is a reviewed remote commit and unixnu.lock records it."]
limits = ["soc/sm8750 is local and is not yet a release-quality shared source.", "The first resolution pass selects only platform, CPU, AES, prelink and DarwinBoot components."]
next_action = ["Retain qualified SpringBoard/HID kernel, build components offline, then qualify power/resources, external payload capacity and final iOS17 bindings. Pin reviewed feeds before release."]
